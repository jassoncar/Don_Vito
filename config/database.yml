default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("MYSQL_HOST", ENV.fetch("DB_HOST", "127.0.0.1")) %>
  port: <%= ENV.fetch("MYSQL_PORT", 3306) %>
  username: <%= ENV.fetch("MYSQL_USER", "rails") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD", "change_me") %>
development:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE", "sistema_comercial_development") %>
test:
  <<: *default
  database: sistema_comercial_test
production:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE", "sistema_comercial_production") %>
  username: <%= ENV.fetch("MYSQL_USER", "rails") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD") %>
